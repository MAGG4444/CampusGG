services:
  postgres:
    image: postgres:16-alpine
    container_name: campusgg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusgg
      POSTGRES_USER: campusgg
      POSTGRES_PASSWORD: campusgg_dev
    ports:
      - "5432:5432"
    volumes:
      - campusgg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgg -d campusgg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusgg_postgres_data:
