name: CampusGG CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test Backend CampusGG
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: campusgg-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CampusGG version
        id: version
        working-directory: .
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campusgg-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusgg-backend-v${{ steps.version.outputs.version }}
          path: campusgg-backend/dist

  frontend-build-and-test:
    name: Build and Test Frontend CampusGG
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: campusgg-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CampusGG version
        id: version
        working-directory: .
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campusgg-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusgg-frontend-v${{ steps.version.outputs.version }}
          path: campusgg-frontend/dist
