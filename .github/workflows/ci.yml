name: CampusGG CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test Backend CampusGG
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campusgg_test
          POSTGRES_USER: campusgg
          POSTGRES_PASSWORD: campusgg_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusgg -d campusgg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      DATABASE_URL: postgresql://campusgg:campusgg_dev@localhost:5432/campusgg_test?schema=public
      TEST_DATABASE_URL: postgresql://campusgg:campusgg_dev@localhost:5432/campusgg_test?schema=public

    defaults:
      run:
        working-directory: campusgg-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CampusGG version
        id: version
        working-directory: .
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campusgg-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run database migrations
        run: npm run migration:run

      - name: Run tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusgg-backend-v${{ steps.version.outputs.version }}
          path: campusgg-backend/dist

  frontend-build-and-test:
    name: Build and Test Frontend CampusGG
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.base_ref == 'main' || github.base_ref == 'dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: campusgg-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CampusGG version
        id: version
        working-directory: .
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campusgg-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusgg-frontend-v${{ steps.version.outputs.version }}
          path: campusgg-frontend/dist